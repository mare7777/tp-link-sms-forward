services:
  api-bridge:
    image: ${IMAGE_NAME:-tp-link-sms-forward:latest}
    container_name: tp-link-api-bridge
    init: true
    restart: unless-stopped
    command:
      - node
      - ./api-bridge.mjs
    environment:
      NODE_ENV: "production"
      CONFIG__URL: "${CONFIG__URL:-http://192.168.1.1}"
      CONFIG__LOGIN: "${CONFIG__LOGIN:-admin}"
      CONFIG__PASSWORD: "${CONFIG__PASSWORD:?CONFIG__PASSWORD is required}"
      CONFIG__API_LISTEN_HOST: "${CONFIG__API_LISTEN_HOST:-0.0.0.0}"
      CONFIG__API_LISTEN_PORT: "${CONFIG__API_LISTEN_PORT:-3000}"
      CONFIG__API_USERS__APIUSER: "${CONFIG__API_USERS__APIUSER:?CONFIG__API_USERS__APIUSER is required}"
    ports:
      - "3000:3000"
    networks:
      - tp-link-sms-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/healthz")
            .then((res) => process.exit(res.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  sms-cat:
    image: ${IMAGE_NAME:-tp-link-sms-forward:latest}
    container_name: tp-link-sms-cat
    init: true
    restart: unless-stopped
    command:
      - node
      - ./sms-cat.mjs
    environment:
      NODE_ENV: "production"
      CONFIG__API_CLIENT_URL: "${CONFIG__API_CLIENT_URL:-http://api-bridge:3000}"
      CONFIG__API_CLIENT_LOGIN: "${CONFIG__API_CLIENT_LOGIN:-apiuser}"
      CONFIG__API_CLIENT_PASSWORD: "${CONFIG__API_CLIENT_PASSWORD:?CONFIG__API_CLIENT_PASSWORD is required}"
      CONFIG__API_CLIENT_POLLING_DELAY: "${CONFIG__API_CLIENT_POLLING_DELAY:-3000}"
      CONFIG__API_CLIENT_POLLING_JITTER_MS: "${CONFIG__API_CLIENT_POLLING_JITTER_MS:-500}"
      CONFIG__SMS_DELIVERY_MODE: "${CONFIG__SMS_DELIVERY_MODE:-at_least_once}"
      CONFIG__TELEGRAM_ENABLED: "${CONFIG__TELEGRAM_ENABLED:-false}"
      CONFIG__TELEGRAM_BOT_TOKEN: "${CONFIG__TELEGRAM_BOT_TOKEN:-}"
      CONFIG__TELEGRAM_CHAT_ID: "${CONFIG__TELEGRAM_CHAT_ID:-}"
      CONFIG__TELEGRAM_MAX_RETRIES: "${CONFIG__TELEGRAM_MAX_RETRIES:-3}"
      CONFIG__TELEGRAM_RETRY_INITIAL_BACKOFF_MS: "${CONFIG__TELEGRAM_RETRY_INITIAL_BACKOFF_MS:-1000}"
      CONFIG__TELEGRAM_RETRY_MAX_BACKOFF_MS: "${CONFIG__TELEGRAM_RETRY_MAX_BACKOFF_MS:-10000}"
      CONFIG__TELEGRAM_TIMEOUT_MS: "${CONFIG__TELEGRAM_TIMEOUT_MS:-10000}"
      CONFIG__SMS_LOG_FULL_CONTENT: "${CONFIG__SMS_LOG_FULL_CONTENT:-false}"
    volumes:
      - sms_state:/app/state
    networks:
      - tp-link-sms-network
    depends_on:
      api-bridge:
        condition: service_healthy

  smtp-gateway:
    image: ${IMAGE_NAME:-tp-link-sms-forward:latest}
    container_name: tp-link-smtp-gateway
    init: true
    restart: unless-stopped
    command:
      - node
      - ./smtp-gateway.mjs
    environment:
      NODE_ENV: "production"
      CONFIG__SMS_GATEWAY_URL: "${CONFIG__SMS_GATEWAY_URL:-http://api-bridge:3000}"
      CONFIG__SMS_GATEWAY_LOGIN: "${CONFIG__SMS_GATEWAY_LOGIN:-apiuser}"
      CONFIG__SMS_GATEWAY_PASSWORD: "${CONFIG__SMS_GATEWAY_PASSWORD:?CONFIG__SMS_GATEWAY_PASSWORD is required}"
      CONFIG__SMS_GATEWAY_DOMAIN: "${CONFIG__SMS_GATEWAY_DOMAIN:-smtp2sms.local}"
      CONFIG__SMS_GATEWAY_LISTEN_HOST: "${CONFIG__SMS_GATEWAY_LISTEN_HOST:-0.0.0.0}"
      CONFIG__SMS_GATEWAY_LISTEN_PORT: "${CONFIG__SMS_GATEWAY_LISTEN_PORT:-1025}"
    ports:
      - "1025:1025"
    networks:
      - tp-link-sms-network
    depends_on:
      api-bridge:
        condition: service_healthy

networks:
  tp-link-sms-network:
    driver: bridge

volumes:
  sms_state:
